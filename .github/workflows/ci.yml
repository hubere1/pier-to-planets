# CI (docs/07 M0): dieselben Schritte wie `npm run verify`.
# Nur Linux-Runner (Faktor 1 im Free-Kontingent von 2.000 Min./Monat, D-020).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # M3: verify dauert mit allen Playwright-Tests (1 Worker) ~14 Min.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Playwright-Browser (gecacht)
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run verify
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: app/test-results
          retention-days: 7
